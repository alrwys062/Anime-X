name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Could not detect Java major version."
            exit 1
          fi
          echo "Detected Java Major Version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or higher. Detected: $JAVA_VER"
            exit 1
          fi
          echo "Java version verification passed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Creating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "./debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" -type f || true
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK at $APK_PATH is empty."
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension"; exit 1 ;;
          esac

          echo "Debug APK verified successfully at: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
