name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        run: |
          if [ -f "./debug.keystore.base64" ] && [ ! -f "./debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore || true
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "Generating new debug.keystore with keytool..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Could not find or generate ./debug.keystore"
            exit 1
          fi
          echo "debug.keystore ready."

      - name: Setup Gradle Wrapper & Permissions
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle wrapper via Gradle 9.3.1..."
            gradle wrapper --gradle-version 9.3.1 || true
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Searching for any generated APK in app/build/outputs/apk..."
            find app/build/outputs/apk -name "*.apk" -type f
            exit 1
          fi
          echo "APK successfully built at $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release Asset
        id: prep_asset
        run: |
          RELEASE_DIR=$(mktemp -d)
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_DIR/app-debug.apk"
          echo "asset_path=$RELEASE_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET="${{ steps.prep_asset.outputs.asset_path }}"

          gh release create "$TAG" "$ASSET" \
            --title "$TITLE" \
            --notes "Automatically built debug APK for AnimeX (Run #${{ github.run_number }})" \
            --target "${{ github.sha }}" \
            --latest
